<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tearsheet - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            color: #58a6ff;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 18px;
            color: #8b949e;
            margin-bottom: 40px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background-color: #161b22;
            color: #e6edf3;
            outline: none;
            transition: border-color 0.2s;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #58a6ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4094ff;
        }

        .examples {
            margin-top: 30px;
            color: #8b949e;
            font-size: 14px;
        }

        .examples span {
            color: #58a6ff;
            cursor: pointer;
            text-decoration: underline;
            margin: 0 5px;
        }

        .examples span:hover {
            color: #4094ff;
        }

        .error-message {
            color: #f85149;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .random-button {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #58a6ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .random-button:hover {
            background-color: #4094ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Financial Tearsheet</h1>
        <p class="subtitle">Enter a stock ticker to view comprehensive financial analysis</p>
        
        <form action="/tearsheet" method="GET" class="search-container" onsubmit="return validateForm(event)">
            <input type="text" id="tickerInput" name="ticker" placeholder="Enter stock ticker (e.g., AAPL, GOOGL, MSFT)" required>
            <button type="submit">Search</button>
            <button type="button" class="random-button" onclick="randomTicker()">Random</button>
        </form>
        
        <div id="errorMessage" class="error-message"></div>
        
        <div class="examples">
            Try: <span onclick="search('AAPL')">AAPL</span>
            <span onclick="search('GOOGL')">GOOGL</span>
            <span onclick="search('MSFT')">MSFT</span>
            <span onclick="search('TSLA')">TSLA</span>
        </div>
    </div>

    <script>
        const RANDOM_TICKERS = [
            'AAPL', 'MSFT', 'GOOGL', 'AMZN', 'META', 'NVDA', 'TSLA', 'BRK-B',
            'JPM', 'GS', 'MS', 'BAC', 'WFC', 'V', 'MA',
            'JNJ', 'UNH', 'PFE', 'ABBV',
            'XOM', 'CVX', 'COP',
            'WMT', 'COST', 'HD', 'MCD', 'NKE',
            'DIS', 'NFLX', 'SPOT', 'UBER', 'ABNB',
            'LMT', 'RTX', 'BA',
            'AMT', 'PLD', 'SPG'
        ];

        function search(ticker) {
            window.location.href = `/tearsheet?ticker=${ticker}`;
        }

        function randomTicker() {
            const randomIndex = Math.floor(Math.random() * RANDOM_TICKERS.length);
            const ticker = RANDOM_TICKERS[randomIndex];
            document.getElementById('tickerInput').value = ticker;
            window.location.href = `/tearsheet?ticker=${ticker}`;
        }

        function validateForm(event) {
            event.preventDefault();
            const input = document.getElementById('tickerInput');
            const errorMessage = document.getElementById('errorMessage');
            const ticker = input.value.trim().toUpperCase();
            
            // Clear previous error
            errorMessage.style.display = 'none';
            
            // Check if empty
            if (!ticker) {
                errorMessage.textContent = 'Please enter a ticker symbol';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // Check length
            if (ticker.length > 10) {
                errorMessage.textContent = 'Ticker symbols are typically 1-5 characters';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // Check for invalid characters (only allow letters, numbers, dots, and dashes)
            const validPattern = /^[A-Z0-9.-]+$/;
            if (!validPattern.test(ticker)) {
                errorMessage.textContent = 'Please enter a valid ticker symbol';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // Update input value with uppercase
            input.value = ticker;
            
            // Submit form
            event.target.submit();
            return true;
        }
    </script>
</body>
</html>
